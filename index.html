<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }
    .egg {
      width: 140px;
      height: 190px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fffbf0 50%, #e6dccb 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.05),
                  0 15px 25px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
